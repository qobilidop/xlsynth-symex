<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">System boundary and ownership layers of xlsynth-symex</title>
  <desc id="desc">DSLX or textual IR is compiled and parsed by xlsynth, traversed through xlsynth-pir, evaluated by the backend-neutral xlsynth-symex core, and optionally sent through a replaceable Z3 adapter. Selection witnesses are replayed through the independent XLS interpreter, while whole-machine execution remains downstream.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .upstream { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .core { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; }
      .core-part { fill: #ffffff; stroke: #fdba74; stroke-width: 1.5; }
      .solver { fill: #faf5ff; stroke: #9333ea; stroke-width: 2; }
      .output { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .outside { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 5; }
      .boundary { fill: none; stroke: #0284c7; stroke-width: 2; stroke-dasharray: 9 6; }
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .heading { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #334155; }
      .label { font: 650 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 500 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #0f172a; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .return-edge { fill: none; stroke: #16a34a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760" rx="18"/>
  <text class="title" x="40" y="46">System boundary: pure XLS in, typed symbolic results out</text>
  <text class="subtitle" x="40" y="73">Each layer has one job; solver-specific and whole-machine concerns remain outside the symbolic core.</text>

  <text class="heading" x="54" y="112">AUTHORITATIVE XLS FRONT END</text>
  <rect class="panel" x="40" y="126" width="1120" height="158" rx="16"/>

  <rect class="upstream" x="70" y="166" width="180" height="76" rx="13"/>
  <text class="label" x="160" y="195" text-anchor="middle">DSLX or textual IR</text>
  <text class="small" x="160" y="220" text-anchor="middle">source artifact</text>

  <path class="edge" d="M250 204 L300 204"/>
  <rect class="upstream" x="300" y="154" width="210" height="100" rx="13"/>
  <text class="label" x="405" y="184" text-anchor="middle">xlsynth</text>
  <text class="small" x="405" y="209" text-anchor="middle">compile · parse · optimize</text>
  <text class="small" x="405" y="232" text-anchor="middle">interpret · replay</text>

  <path class="edge" d="M510 204 L560 204"/>
  <rect class="upstream" x="560" y="166" width="160" height="76" rx="13"/>
  <text class="label" x="640" y="195" text-anchor="middle">textual XLS IR</text>
  <text class="small" x="640" y="220" text-anchor="middle">semantic boundary</text>

  <path class="edge" d="M720 204 L770 204"/>
  <rect class="upstream" x="770" y="154" width="170" height="100" rx="13"/>
  <text class="label" x="855" y="184" text-anchor="middle">xlsynth-pir</text>
  <text class="small" x="855" y="209" text-anchor="middle">native representation</text>
  <text class="small" x="855" y="232" text-anchor="middle">and traversal</text>

  <path class="edge" d="M940 204 L980 204"/>
  <rect class="upstream" x="980" y="166" width="150" height="76" rx="13"/>
  <text class="label" x="1055" y="195" text-anchor="middle">IrFunction</text>
  <text class="small" x="1055" y="220" text-anchor="middle">finite and pure</text>

  <path class="edge" d="M1055 242 C1055 316 820 286 820 344"/>

  <rect class="boundary" x="310" y="318" width="560" height="284" rx="20"/>
  <rect x="386" y="305" width="408" height="28" rx="14" fill="#e0f2fe"/>
  <text class="heading" x="590" y="324" text-anchor="middle">BACKEND-NEUTRAL XLSYNTH-SYMEX CORE</text>

  <rect class="core" x="340" y="350" width="500" height="222" rx="16"/>
  <text class="label" x="590" y="382" text-anchor="middle">typed symbolic evaluation</text>

  <rect class="core-part" x="372" y="408" width="204" height="62" rx="11"/>
  <text class="label" x="474" y="433" text-anchor="middle">SymbolicValue</text>
  <text class="small" x="474" y="456" text-anchor="middle">bits · tuples · arrays</text>

  <rect class="core-part" x="604" y="408" width="204" height="62" rx="11"/>
  <text class="label" x="706" y="433" text-anchor="middle">ExprArena</text>
  <text class="small" x="706" y="456" text-anchor="middle">typed interned DAG</text>

  <rect class="core-part" x="372" y="492" width="204" height="56" rx="11"/>
  <text class="label" x="474" y="518" text-anchor="middle">merged evaluator</text>
  <text class="small" x="474" y="539" text-anchor="middle">one symbolic result</text>

  <rect class="core-part" x="604" y="492" width="204" height="56" rx="11"/>
  <text class="label" x="706" y="518" text-anchor="middle">selection engine</text>
  <text class="small" x="706" y="539" text-anchor="middle">guards · traces</text>

  <path class="edge" d="M840 462 L900 462"/>
  <text class="tiny" x="830" y="446" text-anchor="end">typed guard</text>
  <rect class="solver" x="900" y="382" width="120" height="160" rx="14"/>
  <text class="label" x="960" y="416" text-anchor="middle">solver</text>
  <text class="label" x="960" y="438" text-anchor="middle">adapter</text>
  <text class="small" x="960" y="472" text-anchor="middle">SMT-LIB</text>
  <text class="small" x="960" y="495" text-anchor="middle">model parsing</text>
  <text class="tiny" x="960" y="524" text-anchor="middle">replaceable boundary</text>

  <path class="edge" d="M1020 462 L1060 462"/>
  <rect class="solver" x="1060" y="420" width="90" height="84" rx="42"/>
  <text class="label" x="1105" y="457" text-anchor="middle">Z3</text>
  <text class="small" x="1105" y="480" text-anchor="middle">today</text>

  <path class="return-edge" d="M590 572 L590 630"/>
  <rect class="output" x="386" y="630" width="408" height="86" rx="14"/>
  <text class="label" x="590" y="660" text-anchor="middle">typed public results</text>
  <text class="small" x="590" y="685" text-anchor="middle">guards · residual values · traces · witnesses</text>
  <text class="small" x="590" y="706" text-anchor="middle">explicit complete or incomplete status</text>

  <path class="return-edge" d="M386 674 C250 674 218 610 218 520"/>
  <rect class="output" x="60" y="404" width="208" height="116" rx="14"/>
  <text class="label" x="164" y="436" text-anchor="middle">independent XLS oracle</text>
  <text class="small" x="164" y="463" text-anchor="middle">interpreter or JIT</text>
  <text class="small" x="164" y="486" text-anchor="middle">replays typed witnesses</text>
  <text class="tiny" x="164" y="508" text-anchor="middle">validation, not core semantics</text>

  <rect class="outside" x="858" y="630" width="282" height="86" rx="14"/>
  <text class="label" x="999" y="660" text-anchor="middle">downstream consumers</text>
  <text class="small" x="999" y="685" text-anchor="middle">test generation · formal workflows</text>
  <text class="small" x="999" y="706" text-anchor="middle">whole-machine executors</text>
  <path class="edge" d="M794 673 L858 673"/>
</svg>
