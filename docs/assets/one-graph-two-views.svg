<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">One XLS dataflow graph viewed through merged evaluation and path enumeration</title>
  <desc id="desc">A nested pair of selection nodes produces one conditional expression under merged evaluation and three canonical paths under enumeration. On the third path the inner selection is structurally inactive and absent from the trace.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .node { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .choice { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .path { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .inactive { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 5; }
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .heading { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #334155; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 500 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #0f172a; }
      .mono-small { font: 500 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700" rx="18"/>
  <text class="title" x="40" y="46">One eager graph, two symbolic views</text>
  <text class="subtitle" x="40" y="73">The evaluator shares value semantics; only the treatment of declared choices changes.</text>

  <rect class="panel" x="40" y="96" width="330" height="520" rx="16"/>
  <text class="heading" x="64" y="127">ONE XLS DATAFLOW GRAPH</text>

  <rect class="node" x="70" y="158" width="72" height="44" rx="10"/>
  <text class="label" x="106" y="186" text-anchor="middle">A</text>
  <rect class="node" x="174" y="158" width="72" height="44" rx="10"/>
  <text class="label" x="210" y="186" text-anchor="middle">B</text>
  <rect class="node" x="278" y="158" width="62" height="44" rx="22"/>
  <text class="mono" x="309" y="186" text-anchor="middle">y</text>

  <path class="edge" d="M106 202 L146 256"/>
  <path class="edge" d="M210 202 L185 256"/>
  <path class="edge" d="M309 202 L220 256"/>
  <text class="small" x="112" y="233">case 0</text>
  <text class="small" x="204" y="233">case 1</text>

  <rect class="choice" x="118" y="256" width="142" height="64" rx="12"/>
  <text class="label" x="189" y="282" text-anchor="middle">inner choice</text>
  <text class="mono-small" x="189" y="304" text-anchor="middle">sel(y; A, B)</text>

  <rect class="node" x="70" y="365" width="72" height="44" rx="10"/>
  <text class="label" x="106" y="393" text-anchor="middle">C</text>
  <rect class="node" x="278" y="365" width="62" height="44" rx="22"/>
  <text class="mono" x="309" y="393" text-anchor="middle">x</text>

  <path class="edge" d="M189 320 L176 450"/>
  <path class="edge" d="M106 409 L155 450"/>
  <path class="edge" d="M309 409 L221 450"/>
  <text class="small" x="184" y="386">case 0</text>
  <text class="small" x="112" y="437">case 1</text>

  <rect class="choice" x="118" y="450" width="142" height="64" rx="12"/>
  <text class="label" x="189" y="476" text-anchor="middle">outer choice</text>
  <text class="mono-small" x="189" y="498" text-anchor="middle">sel(x; inner, C)</text>
  <path class="edge" d="M189 514 L189 558"/>
  <rect class="node" x="145" y="558" width="88" height="38" rx="10"/>
  <text class="label" x="189" y="583" text-anchor="middle">return</text>

  <rect class="panel" x="395" y="96" width="350" height="520" rx="16"/>
  <text class="heading" x="419" y="127">MERGED EVALUATION</text>
  <text class="small" x="419" y="158">Selections remain conditional values.</text>

  <rect class="node" x="430" y="196" width="280" height="112" rx="14"/>
  <text class="label" x="570" y="226" text-anchor="middle">one compact result</text>
  <text class="mono" x="570" y="258" text-anchor="middle">ite(x = 1, C,</text>
  <text class="mono" x="570" y="282" text-anchor="middle">    ite(y = 1, B, A))</text>

  <path class="edge" d="M570 308 L570 356"/>
  <rect class="panel" x="430" y="356" width="280" height="118" rx="14"/>
  <text class="label" x="570" y="389" text-anchor="middle">SymexResult</text>
  <text class="small" x="570" y="419" text-anchor="middle">compact whole-function value</text>
  <text class="small" x="570" y="444" text-anchor="middle">no explicit coverage claim</text>

  <text class="small" x="430" y="526">Useful for equivalence checking and as</text>
  <text class="small" x="430" y="549">the semantic core of residual path values.</text>
  <text class="small" x="430" y="581">Both selection cones remain represented.</text>

  <rect class="panel" x="770" y="96" width="390" height="520" rx="16"/>
  <text class="heading" x="794" y="127">CANONICAL PATH ENUMERATION</text>
  <text class="small" x="794" y="158">Declared choices split the evaluation state.</text>

  <rect class="path" x="800" y="184" width="330" height="104" rx="13"/>
  <text class="label" x="820" y="211">Path 1</text>
  <text class="mono-small" x="820" y="237">condition: x = 0 ∧ y = 0</text>
  <text class="mono-small" x="820" y="260">result: A   trace: outer=0, inner=0</text>

  <rect class="path" x="800" y="306" width="330" height="104" rx="13"/>
  <text class="label" x="820" y="333">Path 2</text>
  <text class="mono-small" x="820" y="359">condition: x = 0 ∧ y = 1</text>
  <text class="mono-small" x="820" y="382">result: B   trace: outer=0, inner=1</text>

  <rect class="path" x="800" y="428" width="330" height="126" rx="13"/>
  <text class="label" x="820" y="455">Path 3</text>
  <text class="mono-small" x="820" y="481">condition: x = 1</text>
  <text class="mono-small" x="820" y="504">result: C   trace: outer=1</text>
  <rect class="inactive" x="820" y="518" width="286" height="24" rx="7"/>
  <text class="small" x="963" y="535" text-anchor="middle">inner choice inactive — y is don't-care</text>

  <text class="small" x="800" y="585">Each feasible path also receives a witness.</text>

  <rect x="188" y="640" width="824" height="38" rx="19" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text class="label" x="600" y="665" text-anchor="middle">Three canonical paths, not four: inactive choices are absent rather than arbitrarily valued.</text>
</svg>
