<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">One XLS dataflow graph viewed through merged evaluation and selection enumeration</title>
  <desc id="desc">A dataflow graph contains a nested selection and a parallel equal-valued selection. Merged evaluation produces one conditional value. Selection enumeration produces six guarded results. The expanded result identifies its sparse canonical selection trace, guard, residual result, and complete concrete witness. When the outer selection chooses C, the nested selection is inactive and absent. The equal-valued peer selection remains in every trace because it is structurally active.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .value { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .selection { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .result { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .highlight { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
      .inactive { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .note { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .heading { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #334155; }
      .label { font: 650 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #0f172a; }
      .mono-small { font: 500 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .fanout { fill: none; stroke: #94a3b8; stroke-width: 1.8; marker-end: url(#arrow); }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900" rx="18"/>
  <text class="title" x="40" y="46">One eager dataflow graph, two symbolic views</text>
  <text class="subtitle" x="40" y="73">The value semantics are shared; enumeration additionally preserves the identity and domain of active selections.</text>

  <rect class="panel" x="40" y="100" width="390" height="690" rx="16"/>
  <text class="heading" x="64" y="132">1 · XLS DATAFLOW GRAPH</text>

  <rect class="value" x="66" y="158" width="56" height="40" rx="9"/>
  <text class="label" x="94" y="183" text-anchor="middle">A</text>
  <rect class="value" x="142" y="158" width="56" height="40" rx="9"/>
  <text class="label" x="170" y="183" text-anchor="middle">B</text>
  <rect class="value" x="246" y="158" width="56" height="40" rx="20"/>
  <text class="mono" x="274" y="183" text-anchor="middle">y</text>
  <path class="edge" d="M94 198 L132 228"/>
  <path class="edge" d="M170 198 L170 228"/>
  <path class="edge" d="M274 198 L214 228"/>
  <rect class="selection" x="92" y="228" width="156" height="58" rx="11"/>
  <text class="label" x="170" y="252" text-anchor="middle">inner selection</text>
  <text class="mono-small" x="170" y="273" text-anchor="middle">sel(y; A, B)</text>

  <rect class="value" x="304" y="272" width="56" height="40" rx="9"/>
  <text class="label" x="332" y="297" text-anchor="middle">C</text>
  <rect class="value" x="304" y="338" width="56" height="40" rx="20"/>
  <text class="mono" x="332" y="363" text-anchor="middle">x</text>
  <path class="edge" d="M170 286 L170 342"/>
  <path class="edge" d="M332 312 L248 351"/>
  <path class="edge" d="M304 358 L248 368"/>
  <rect class="selection" x="92" y="342" width="156" height="58" rx="11"/>
  <text class="label" x="170" y="366" text-anchor="middle">outer selection</text>
  <text class="mono-small" x="170" y="387" text-anchor="middle">sel(x; inner, C)</text>

  <rect class="value" x="66" y="460" width="56" height="40" rx="9"/>
  <text class="label" x="94" y="485" text-anchor="middle">D</text>
  <rect class="value" x="304" y="460" width="56" height="40" rx="20"/>
  <text class="mono" x="332" y="485" text-anchor="middle">z</text>
  <path class="fanout" d="M94 500 C94 520 128 520 137 538"/>
  <path class="fanout" d="M94 500 C94 542 190 518 201 538"/>
  <path class="edge" d="M332 500 L232 545"/>
  <rect class="selection" x="92" y="538" width="156" height="58" rx="11"/>
  <text class="label" x="170" y="562" text-anchor="middle">peer selection</text>
  <text class="mono-small" x="170" y="583" text-anchor="middle">sel(z; D, D)</text>

  <path class="edge" d="M170 400 C170 440 262 604 232 642"/>
  <path class="edge" d="M170 596 L170 628"/>
  <rect class="value" x="135" y="628" width="100" height="48" rx="11"/>
  <text class="label" x="185" y="657" text-anchor="middle">add</text>
  <path class="edge" d="M185 676 L185 712"/>
  <rect class="value" x="130" y="712" width="110" height="42" rx="10"/>
  <text class="label" x="185" y="738" text-anchor="middle">return</text>
  <text class="tiny" x="274" y="565">both cases are D</text>
  <text class="small" x="64" y="778">Parallel selections contribute jointly to one trace.</text>

  <rect class="panel" x="455" y="100" width="310" height="690" rx="16"/>
  <text class="heading" x="479" y="132">2 · MERGED EVALUATION</text>
  <text class="small" x="479" y="161">Selections become conditional values.</text>
  <rect class="value" x="480" y="205" width="260" height="142" rx="14"/>
  <text class="label" x="610" y="237" text-anchor="middle">one compact result</text>
  <text class="mono" x="610" y="275" text-anchor="middle">add(</text>
  <text class="mono" x="610" y="299" text-anchor="middle"> ite(x = 1, C,</text>
  <text class="mono" x="610" y="323" text-anchor="middle">     ite(y = 1, B, A)), D)</text>
  <rect class="note" x="480" y="382" width="260" height="120" rx="13"/>
  <text class="label" x="610" y="413" text-anchor="middle">value-equivalent simplification</text>
  <text class="small" x="610" y="443" text-anchor="middle">peer = sel(z; D, D) becomes D</text>
  <text class="small" x="610" y="468" text-anchor="middle">so the value no longer reveals z</text>
  <rect class="panel" x="480" y="540" width="260" height="112" rx="13"/>
  <text class="label" x="610" y="572" text-anchor="middle">SymexResult</text>
  <text class="small" x="610" y="602" text-anchor="middle">compact whole-function value</text>
  <text class="small" x="610" y="627" text-anchor="middle">no selection-coverage claim</text>
  <text class="small" x="479" y="704">Useful for equivalence checking and as the</text>
  <text class="small" x="479" y="727">semantic core of every residual result.</text>

  <rect class="panel" x="790" y="100" width="570" height="690" rx="16"/>
  <text class="heading" x="814" y="132">3 · SELECTION ENUMERATION</text>
  <text class="small" x="814" y="161">Six unique traces partition all eight selector assignments.</text>

  <text class="tiny" x="818" y="194">CANONICAL SELECTION TRACE</text>
  <text class="tiny" x="1042" y="194">GUARD</text>
  <text class="tiny" x="1242" y="194">RESIDUAL</text>
  <rect class="result" x="812" y="208" width="526" height="42" rx="8"/>
  <text class="mono-small" x="825" y="234">{outer=0, inner=0, peer=0}</text>
  <text class="mono-small" x="1038" y="234">x=0 ∧ y=0 ∧ z=0</text>
  <text class="mono-small" x="1240" y="234">A + D</text>
  <rect class="result" x="812" y="258" width="526" height="42" rx="8"/>
  <text class="mono-small" x="825" y="284">{outer=0, inner=0, peer=1}</text>
  <text class="mono-small" x="1038" y="284">x=0 ∧ y=0 ∧ z=1</text>
  <text class="mono-small" x="1240" y="284">A + D</text>
  <rect class="highlight" x="812" y="308" width="526" height="42" rx="8"/>
  <text class="mono-small" x="825" y="334">{outer=0, inner=1, peer=0}</text>
  <text class="mono-small" x="1038" y="334">x=0 ∧ y=1 ∧ z=0</text>
  <text class="mono-small" x="1240" y="334">B + D</text>
  <rect class="result" x="812" y="358" width="526" height="42" rx="8"/>
  <text class="mono-small" x="825" y="384">{outer=0, inner=1, peer=1}</text>
  <text class="mono-small" x="1038" y="384">x=0 ∧ y=1 ∧ z=1</text>
  <text class="mono-small" x="1240" y="384">B + D</text>
  <rect class="result" x="812" y="408" width="526" height="42" rx="8"/>
  <text class="mono-small" x="825" y="434">{outer=1, peer=0}</text>
  <text class="mono-small" x="1038" y="434">x=1 ∧ z=0</text>
  <text class="mono-small" x="1240" y="434">C + D</text>
  <rect class="result" x="812" y="458" width="526" height="42" rx="8"/>
  <text class="mono-small" x="825" y="484">{outer=1, peer=1}</text>
  <text class="mono-small" x="1038" y="484">x=1 ∧ z=1</text>
  <text class="mono-small" x="1240" y="484">C + D</text>

  <rect class="highlight" x="812" y="526" width="526" height="126" rx="13"/>
  <text class="label" x="832" y="554">Expanded guarded result</text>
  <text class="mono-small" x="832" y="580">trace    {outer=0, inner=1, peer=0}</text>
  <text class="mono-small" x="832" y="603">guard    x=0 ∧ y=1 ∧ z=0</text>
  <text class="mono-small" x="832" y="626">residual B + D</text>
  <text class="mono-small" x="1080" y="580">witness</text>
  <text class="mono-small" x="1080" y="603">(x,y,z,A,B,C,D)</text>
  <text class="mono-small" x="1080" y="626">= (0,1,0,2,4,6,1)</text>

  <rect class="inactive" x="812" y="674" width="250" height="72" rx="11"/>
  <text class="label" x="937" y="700" text-anchor="middle">structural inactivity</text>
  <text class="small" x="937" y="724" text-anchor="middle">x=1 → inner and y are absent</text>
  <rect class="note" x="1080" y="674" width="258" height="72" rx="11"/>
  <text class="label" x="1209" y="700" text-anchor="middle">coverage identity</text>
  <text class="small" x="1209" y="724" text-anchor="middle">peer remains despite equal values</text>

  <rect x="188" y="824" width="1024" height="42" rx="21" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text class="label" x="700" y="850" text-anchor="middle">A complete selection partition = unique traces + disjoint guards + full domain coverage + one witness per guarded result.</text>
</svg>
